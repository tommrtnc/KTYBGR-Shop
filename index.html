<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Shop</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#fff5f7;
    }

    header{
      background:#ff69b4;
      color:white;
      padding:20px;
      text-align:center;
      font-size:32px;
      font-weight:bold;
    }

    .hero{
      text-align:center;
      padding:80px 20px;
    }

    .hero h1{
      font-size:50px;
      color:#333;
    }

    .hero p{
      color:#666;
      font-size:20px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card h2{
      padding:10px;
    }

    .card p{
      padding:0 10px 20px;
    }

    footer{
      background:#ff69b4;
      color:white;
      text-align:center;
      padding:20px;
    }

  </style>

</head>

<body>

<header>
  🍪 Cookie Shop
</header>

<section class="hero">
  <h1>Fresh Homemade Cookies</h1>
  <p>อบใหม่ทุกวัน ส่งตรงถึงบ้านคุณ</p>
</section>

<section class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1499636136210-6f4ee915583e?q=80&w=1200">
    <h2>Chocolate Cake</h2>
    <p>199 บาท</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=1200">
    <h2>Cookies</h2>
    <p>89 บาท</p>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?q=80&w=1200">
    <h2>Donut</h2>
    <p>79 บาท</p>
  </div>

</section>

<footer>
  © 2026 Cookie Shop
</footer>

</body>
</html>
